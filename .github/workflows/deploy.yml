name: Deploy to CloudBase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login to CloudBase
        env:
          TCB_SECRET_ID: ${{ secrets.SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          echo "SecretId prefix: ${TCB_SECRET_ID:0:6}"   # 仅打印前6位，不影响安全
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY" --force

      - name: Deploy to CloudBase
        env:
          TCB_ENV_ID: ${{ secrets.ENV_ID }}
        run: |
          tcb hosting deploy ./ /tupian -e "$TCB_ENV_ID"
