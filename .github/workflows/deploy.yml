name: Deploy to CloudBase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login to CloudBase
        run: |
          tcb login --apiKeyId "AKIDtxpX4by84oRuCKE7pNo34twoTvP2Xqyu" \
                    --apiKey "pRtIdp9TFsJ2Zw9C3iAPSIzTktwq46va"

      - name: Deploy to CloudBase
        run: |
          # 删除 .git 目录，避免权限问题
          rm -rf .git
          tcb hosting deploy ./ /tupian -e "tuping-d5gut3td2293ecf01"
