name: Deploy to CloudBase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Create temporary key file and login
        env:
          TCB_SECRET_ID: ${{ secrets.SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          # 生成临时密钥文件（JSON 格式）
          echo "{\"secretId\":\"$TCB_SECRET_ID\",\"secretKey\":\"$TCB_SECRET_KEY\"}" > /tmp/tcb_key.json
          # 使用 --key 方式登录（非交互）
          tcb login --key /tmp/tcb_key.json

      - name: Deploy to CloudBase
        env:
          TCB_ENV_ID: ${{ secrets.ENV_ID }}
        run: |
          tcb hosting deploy ./ /tupian -e "$TCB_ENV_ID"
