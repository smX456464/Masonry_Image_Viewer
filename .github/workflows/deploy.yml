name: Deploy to CloudBase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. 安装 CloudBase CLI
      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      # 4. 使用主账号密钥登录（显式登录，非交互）
      - name: Login to CloudBase
        run: |
          # 这里直接写死密钥用于测试（测试完成后请替换为 Secrets 方式）
          tcb login --apiKeyId "AKIDtxpX4by84oRuCKE7pNo34twoTvP2Xqyu" \
                    --apiKey "pRtIdp9TFsJ2Zw9C3iAPSIzTktwq46va"

      # 5. 部署静态文件到 /tupian 路径，忽略 .git 文件夹
      - name: Deploy to CloudBase
        run: |
          tcb hosting deploy ./ /tupian -e "tuping-d5gut3td2293ecf01" --ignore .git
